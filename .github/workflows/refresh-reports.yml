name: Refresh Hawaii ballot reports

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - ".github/workflows/refresh-reports.yml"
  schedule:
    - cron: "17 5,9,13,17 * * *"
      timezone: "Pacific/Honolulu"

concurrency:
  group: hawaii-ballot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install parser dependency
        run: python -m pip install -r automation/requirements.txt

      - name: Fetch, parse, and validate reports
        run: >
          python automation/update_reports.py
          --output data/ballot-returns.json
          --manifest data/manifest.json
          --status data/automation-status.json

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- \
            data/ballot-returns.json \
            data/manifest.json \
            data/automation-status.json)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit validated data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/ballot-returns.json \
            data/manifest.json \
            data/automation-status.json
          git diff --cached --check
          git commit -m "data: refresh Hawaii ballot reports"
          git push

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ballot-refresh-diagnostics-${{ github.run_id }}
          path: tmp/refresh-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
